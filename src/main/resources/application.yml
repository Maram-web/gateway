spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service.user.svc.cluster.local:8089
          predicates:
            - Path=/api/auth/**

        - id: storage-service
          uri: http://storage-service.storage.svc.cluster.local:8090
          predicates:
            - Path=/api/storage/**

        # ✅ Ajoute cette route pour le CephTestController
        - id: storage-s3-route
          uri: http://storage-service.storage.svc.cluster.local:8090
          predicates:
            - Path=/api/s3/**
          filters:
            - StripPrefix=2
