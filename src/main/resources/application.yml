spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service.user.svc.cluster.local:8089
          predicates:
            - Path=/api/auth/**

        - id: storage-service
          uri: http://storage-service.storage.svc.cluster.local:8090
          predicates:
            - Path=/api/storage/**

        - id: storage-s3-route
          uri: http://storage-service.storage.svc.cluster.local:8090
          predicates:
            - Path=/api/s3/**

        - id: vm-service
          uri: http://vm-service.vm.svc.cluster.local:8082
          predicates:
            - Path=/api/vm/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
