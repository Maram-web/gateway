apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gateway
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: marammanai/gateway-service:latest # sera remplacé dynamiquement par Jenkins
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service.discovery.svc.cluster.local:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30093
